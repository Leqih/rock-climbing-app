<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotter Watch</title>
  <meta name="description" content="Spotter on Apple Watch Ultra: a clickable prototype. Press the Action button to start and stop each climb while your phone films.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    /* watchOS: SF Compact on Apple devices, Inter elsewhere. Sizes are in points of a 49 mm Ultra screen */
    :root { --lime: #DDF26A; --red: #FF453A; --orange: #FF7A1A; --gray: rgba(235, 235, 245, .6); --glass: rgba(255, 255, 255, .16); --cell: rgba(255, 255, 255, .11); --stage: #E7E7E3;
      --f: -apple-system, 'SF Compact Rounded', 'SF Compact', 'SF Pro Rounded', 'Inter', system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--stage); }
    body { display: grid; place-items: center; font-family: var(--f); -webkit-font-smoothing: antialiased; overflow: hidden; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    button:focus-visible { outline: 3px solid #0A84FF; outline-offset: 2px; }
    .num { font-variant-numeric: tabular-nums; }

    /* Apple Watch Ultra 4, Black, Ocean Band (Apple Design Resources). The screen sits under the bezel's transparent hole */
    .device { position: relative; width: 620px; height: 940px; zoom: var(--fit, 1); }
    .bezel { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
    .ws { position: absolute; left: 96px; top: 210px; width: 428px; height: 519px; border-radius: 74px; overflow: hidden; background: #000; color: #fff; }
    .scr { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 22px 30px 24px; }
    /* the orange Action button on the left of the case: the main way in and out of a climb */
    .act { position: absolute; left: 36px; top: 430px; width: 24px; height: 184px; border-radius: 8px; z-index: 3; }
    .act:hover, .act.hint { box-shadow: 0 0 0 3px rgba(255, 122, 26, .55); }
    .act.press { transform: translateX(3px); }

    .tb { display: flex; justify-content: space-between; align-items: baseline; padding: 0 20px; font-size: 19px; font-weight: 600; }
    .tb b { color: var(--lime); font-weight: 600; }
    .body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 0; }
    .sub { font-size: 19px; color: var(--gray); }
    .big { font-size: 84px; font-weight: 600; line-height: 1; letter-spacing: -1px; }
    .big.lime { color: var(--lime); }
    .note { margin-top: 8px; font-size: 17px; line-height: 1.25; color: var(--gray); }
    .live { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 19px; color: var(--gray); }
    .rec { width: 11px; height: 11px; border-radius: 50%; background: var(--red); animation: blink 1.2s infinite; }
    @keyframes blink { 50% { opacity: .3; } }

    /* what the phone sees, sent to the wrist like Camera Remote */
    .pv { position: relative; width: 100%; height: 232px; margin-top: 10px; border-radius: 22px; overflow: hidden; background: #222; }
    .pv img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; }
    .pv span { position: absolute; left: 10px; top: 10px; display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 12px; background: rgba(0, 0, 0, .55); font-size: 14px; font-weight: 600; }
    .pv span i { width: 8px; height: 8px; border-radius: 50%; background: #30D158; }
    .ok { margin-top: 10px; font-size: 16px; color: var(--gray); }

    /* the cue for the Action button, and the on-screen buttons as a backup */
    .ab { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 12px; font-size: 18px; font-weight: 600; }
    .ab i { width: 10px; height: 30px; border-radius: 4px; background: var(--orange); }
    .ab small { font-size: 15px; font-weight: 400; color: var(--gray); }
    .bt { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
    .cap { flex: 1; height: 52px; border-radius: 26px; background: var(--glass); font-size: 19px; font-weight: 600; }
    .rnd { flex: none; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--glass); }
    .rnd svg { width: 20px; height: 20px; }

    .cell { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 18px; border-radius: 20px; background: var(--cell); font-size: 19px; text-align: left; }
    .cell span { color: var(--gray); font-size: 16px; }
    .cell b { font-weight: 600; }
    .cell em { display: block; font-style: normal; font-size: 15px; color: var(--gray); }
    .lime { color: var(--lime); }
    .cells { display: grid; gap: 8px; width: 100%; }
    .hrt { color: var(--red); }
    /* Apple Health: the session is a Climbing workout there, with its heart rate */
    .hk { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 16px; font-weight: 600; }
    .hk i { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: #fff; color: #FF2D55; font-style: normal; font-size: 15px; }
    .ring { width: 150px; height: 150px; }
    .ring circle { fill: none; stroke-width: 14; }
  </style>
</head>
<body>
<div class="device" id="dev" aria-label="Spotter on Apple Watch Ultra, a clickable prototype">
  <div class="ws" id="ws"></div>
  <img class="bezel" src="img/watch-ultra@2x.png" alt="">
  <button class="act" id="act" type="button" aria-label="Action button"></button>
</div>

<script>
(() => {
  const ws = document.getElementById('ws'), actBtn = document.getElementById('act');
  const GYM = 'Boneyard Boulders';
  // 0 frame check, 1 climbing, 2 saved, 3 resting, 4 session saved
  const S = { step: 0, n: 1, climbStart: 0, restStart: 0, readAt: 0, session: 0, climbs: [], hr: 92, hrSum: 0, hrN: 0, hrMax: 0 };
  const clock = () => new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).replace(/\s?[AP]M/, '');
  const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const now = () => Date.now() / 1000;
  const tb = title => `<div class="tb"><b>${title}</b><span class="num">${clock()}</span></div>`;
  const ab = (what, also = '') => `<div class="ab"><i></i>${what}${also ? `<small>· ${also}</small>` : ''}</div>`;
  const stop = '<svg viewBox="0 0 24 24" fill="#fff"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>';

  // what the phone reads from each video, once it's done: the route, which try on it, how high. Sample results on one route
  const read = n => ({ route: 'Orange V2', dot: '#F08A24', tryN: n + 2, hold: Math.min(6, 2 + n), of: 6 });

  function screen() {
    const t = now(), n = S.n;
    if (S.step === 0) return `${tb('Spotter')}
      <div class="body"><div class="pv"><img src="img/v864.jpg" alt=""><span><i></i>Phone · filming when you start</span></div>
        <span class="ok">${GYM} · step in and check you’re in frame</span>
        ${ab(`Press to start climb ${n}`)}</div>
      <div class="bt"><button class="cap" type="button" data-a="go">Start</button></div>`;
    if (S.step === 1) return `${tb('Climb ' + n)}
      <div class="body"><span class="live"><i class="rec"></i>Filming on your phone</span><span class="big lime num" id="tick">${mmss(t - S.climbStart)}</span>
        ${ab('Press when you’re down', 'or double tap')}</div>
      <div class="bt"><button class="cap" type="button" data-a="go">I’m down</button></div>`;
    if (S.step === 2) { const c = S.climbs[S.climbs.length - 1];
      return `${tb('Climb ' + c.n)}
      <div class="body"><svg class="ring" viewBox="0 0 150 150"><circle cx="75" cy="75" r="62" stroke="rgba(221,242,106,.22)"/><circle id="rp" cx="75" cy="75" r="62" stroke="#DDF26A" stroke-linecap="round" stroke-dasharray="389.6" stroke-dashoffset="389.6" transform="rotate(-90 75 75)"/></svg>
        <span class="note">Saved · ${mmss(c.len)}<br>Reading it on your phone</span></div>`; }
    if (S.step === 3) { const c = S.climbs[S.climbs.length - 1], r = t >= S.readAt ? c.r : null;
      return `${tb('Rest')}
      <div class="body"><span class="big num" id="tick">${mmss(t - S.restStart)}</span>
        <div class="cell" style="margin-top:14px">${r ? `<span><b style="color:${r.dot}">●</b> <b style="color:#fff">${r.route}</b><em>Climb ${c.n} · try ${r.tryN} on it</em></span><b class="lime">Hold ${r.hold} of ${r.of}</b>`
          : `<span>Climb ${c.n}</span><b id="rd">Reading…</b>`}</div>
        ${ab(`Press to start climb ${n}`)}</div>
      <div class="bt"><button class="cap" type="button" data-a="end">End session</button><button class="cap" type="button" data-a="go">Climb ${n}</button></div>`; }
    return `${tb('Session')}
      <div class="body"><div class="cells">
        <div class="cell"><span>Time</span><b class="num">${mmss(t - S.session)}</b></div>
        <div class="cell"><span>Climbs</span><b class="num">${S.climbs.length}</b></div>
        <div class="cell"><span>Heart rate</span><b class="num"><b class="hrt">♥</b> ${S.hrN ? `${Math.round(S.hrSum / S.hrN)} avg · ${Math.round(S.hrMax)} max` : '—'}</b></div></div>
        <span class="hk"><i>♥</i>Saved to Health as a Climbing workout</span>
        <span class="note">How high you got is on your phone</span></div>
      <div class="bt"><button class="cap" type="button" data-a="reset">Done</button></div>`;
  }
  const draw = () => { ws.innerHTML = `<div class="scr">${screen()}</div>`; actBtn.classList.toggle('hint', S.step === 0 || S.step === 1 || S.step === 3); };
  const act = {
    // the one action, from the Action button, a double tap, or the screen: start a climb, or end the one you're on
    go() {
      if (S.step === 1) {
        const len = Math.max(8, now() - S.climbStart); S.climbs.push({ n: S.n, len, r: read(S.n) }); S.n++; S.step = 2; draw();
        requestAnimationFrame(() => requestAnimationFrame(() => { const p = document.getElementById('rp'); if (p) { p.style.transition = 'stroke-dashoffset 1.6s ease-in-out'; p.style.strokeDashoffset = '0'; } }));
        S.readAt = now() + 1.8; S.restStart = now(); setTimeout(() => { if (S.step === 2) { S.step = 3; draw(); } }, 1900);
      } else if (S.step === 0 || S.step === 3) { if (!S.session) S.session = now(); S.climbStart = now(); S.step = 1; draw(); }
    },
    end() { S.step = 4; draw(); },
    reset() { Object.assign(S, { step: 0, n: 1, session: 0, climbs: [], hr: 92, hrSum: 0, hrN: 0, hrMax: 0 }); draw(); }
  };
  ws.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b) act[b.dataset.a](); });
  actBtn.addEventListener('click', () => { actBtn.classList.add('press'); setTimeout(() => actBtn.classList.remove('press'), 120); act.go(); });
  // on a computer, the space bar is the Action button
  addEventListener('keydown', e => { if (e.code === 'Space' && !e.repeat) { e.preventDefault(); actBtn.click(); } });
  setInterval(() => {
    if (S.step === 1 || S.step === 2 || S.step === 3) { S.hr += ((S.step === 1 ? 158 : 102) - S.hr) * .06 + (Math.random() - .5) * 2; S.hrSum += S.hr; S.hrN++; S.hrMax = Math.max(S.hrMax, S.hr); }
    const el = document.getElementById('tick');
    if ((S.step === 1 || S.step === 3) && el) el.textContent = mmss(now() - (S.step === 1 ? S.climbStart : S.restStart));
    if (S.step === 3 && document.getElementById('rd') && now() >= S.readAt) draw();
  }, 500);
  const fit = () => document.documentElement.style.setProperty('--fit', Math.min(1, (innerHeight - 32) / 940, (innerWidth - 32) / 620).toFixed(3));
  addEventListener('resize', fit); fit();
  draw();
})();
</script>
</body>
</html>
