<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>chalk. Prototype v7</title>
  <meta name="description" content="chalk. indoor climbing app: clickable prototype of the whole user flow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&display=swap">
  <!-- Gyms page map: Leaflet with OpenStreetMap tiles; needs a connection -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin>
  <link rel="stylesheet" href="styles.css?v=20261105v9">
  <link rel="stylesheet" href="pages.css?v=20261105v9">
</head>
<body>
<main class="stage">
  <div class="device">
  <div class="phone" aria-label="chalk. app prototype">
    <div class="screen">
      <div class="backdrop"><img src="img/woman2.jpg" alt=""></div>
      <div class="m" id="main"></div>
    </div>
    <!-- full-screen camera for "Film a try": filled by app.js -->
    <section class="camx" id="camx" hidden></section>

    <!-- status bar stays put while the screen scrolls under it; frosted once you scroll -->
    <div class="status">
      <span>9:41</span>
      <span class="island" aria-hidden="true"></span>
      <svg width="68" height="13" viewBox="0 0 70 14" fill="#111111" aria-hidden="true"><rect x="0" y="9" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="8" rx="1"/><rect x="10" y="3" width="3" height="11" rx="1"/><rect x="15" y="0" width="3" height="14" rx="1"/><path d="M29 4.5a10 10 0 0 1 14 0l-1.6 1.7a7.6 7.6 0 0 0-10.8 0zM32 7.7a5.6 5.6 0 0 1 8 0L36 12z"/><rect x="47.5" y="1.5" width="19" height="11" rx="3" fill="none" stroke="#111111"/><rect x="49.5" y="3.5" width="13" height="7" rx="1.5"/></svg>
    </div>

    <nav class="dock" aria-label="Main">
      <button class="dk" type="button" data-dock="videos" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg><span>Videos</span><span class="pip" id="videosPip"></span></button>
      <button class="dk" type="button" data-dock="walls"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 21s-7-6.1-7-11.4a7 7 0 0 1 14 0C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.6" r="2.6"/></svg><span>Gyms</span></button>
      <button class="dk plus" type="button" id="plus" data-dock="plus"></button>
      <button class="dk" type="button" data-dock="friends"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/><path d="M15.5 4.8a3.5 3.5 0 0 1 0 6.4M18 13.9c2.1.9 3.5 3 3.5 6.1"/></svg><span>Friends</span><span class="pip" id="friendsPip"></span></button>
      <button class="dk" type="button" data-dock="profile"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg><span>Profile</span></button>
    </nav>

    <div class="scrim" id="scrim"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="grab"></div>
      <h2 id="sheetTitle">Log the send</h2>
      <span class="sub" id="sheetSub"></span>
      <div class="field">
        <span class="lbl" id="feltLbl">How did it feel?</span>
        <div class="opts" id="feltOpts"><button type="button" aria-pressed="false">Easier</button><button type="button" aria-pressed="false">About right</button><button type="button" aria-pressed="false">Harder</button></div>
        <p class="hint">Helps us pick your next route.</p>
      </div>
      <div class="field">
        <label class="lbl" for="noteIn">Note</label>
        <textarea class="note" id="noteIn" rows="2" placeholder="What worked? e.g. left heel hook on move 3"></textarea>
      </div>
      <div class="field">
        <span class="lbl">Who filmed you?</span>
        <div class="opts" id="filmOpts"></div>
        <p class="hint" id="filmHint"></p>
      </div>
      <button class="btn-l" type="button" id="saveTop">Save</button>
    </section>
    <!-- "Sent it?" and "Keep climbing?": filled by app.js -->
    <section class="sheet" id="ask" role="dialog" aria-modal="true"></section>

    <!-- set-up and summary screens put their main button here instead of the dock -->
    <div class="cta" id="cta"></div>
    <div class="home-ind"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <!-- the 16 Pro's buttons: Action and volume on the left, the side button and Camera Control on the right. Volume down switches 中文 / English -->
  <i class="hw act" aria-hidden="true"></i><i class="hw vup" aria-hidden="true"></i><button class="hw vdn" type="button" aria-label="中文 / English" title="中文 / English"></button>
  <i class="hw side" aria-hidden="true"></i><i class="hw cc" aria-hidden="true"></i>
  </div>
  <p class="credit">Version 7 · photos from Unsplash, videos from Wikimedia Commons and Pexels · gyms, people and numbers are placeholders</p>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin></script>
<!-- live pose analysis on clips: MediaPipe Pose Landmarker, loaded from jsDelivr when a clip plays -->
<script src="pose.js?v=20261105v9"></script>
<script src="app.js?v=20261105v9"></script>
<script src="i18n.js?v=20261105v9"></script>
</body>
</html>
